<script>
  // Find the anchor tag (assuming it's the only one with this specific class combination)
  const flashingLink = document.querySelector('a#flashing-link');

  // Set up the flashing interval
  let isFlashed = false;

  const flashInterval = setInterval(() => {
    if (isFlashed) {
      // Reset to original state: red background, white text
      flashingLink.classList.remove('bg-white', 'text-red-500');
      flashingLink.classList.add('bg-red-500', 'text-white');
    } else {
      // Flash state: white background, red text
      flashingLink.classList.remove('bg-red-500', 'text-white');
      flashingLink.classList.add('bg-white', 'text-red-500');
    }
    
    isFlashed = !isFlashed;
  }, 500);
</script>
